# Secrets the repo tooling needs, declared without their values (fnox:
# https://github.com/jdx/fnox). Each maintainer defines the `cf-admin`
# provider in their own ~/.config/fnox/config.toml (macOS Keychain, age, a
# password manager...) and stores the value there; see README "Cloudflare
# deploy tokens as code". Nothing here is secret.

[secrets]
CF_TOKEN_ADMIN = { provider = "cf-admin", value = "voidflow-cf-token-admin", description = "User-owned Cloudflare token for just cf-tokens-*, covering every account in cloudflare/tokens.ts: Account API Tokens Edit, Workers Scripts Read, Zone Read. Local only, never CI.", if_missing = "error" }
