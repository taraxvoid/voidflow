# Secrets the repo tooling needs, declared without their values (fnox:
# https://github.com/jdx/fnox, installed by mise). `cf-admin` defaults to the
# macOS Keychain; to use another backend (age, a password manager...), redefine
# [providers.cf-admin] in a gitignored fnox.local.toml. See CONTRIBUTING.md
# "Cloudflare deploy tokens as code". Nothing here is secret.

[providers.cf-admin]
type = "keychain"
service = "fnox"

[secrets]
# env = false: the shell hook and `fnox exec` leave it out, so it reaches no
# shell; only `fnox proxy run` (below) resolves it.
CF_TOKEN_ADMIN= { provider = "cf-admin", value = "voidflow-cf-token-admin", description = "User-owned Cloudflare admin token for voidflow plan|apply tokens in a repo whose voidflow.config.ts cloudflare section uses this variable: Account API Tokens Edit, Workers Scripts Read, Zone Read on its account. Local only, never CI.", if_missing = "error", env = false }

# `fnox proxy run -- bunx voidflow plan|apply tokens` hands voidflow a
# placeholder for CF_TOKEN_ADMIN and puts the real token into the
# Authorization header only on Cloudflare API calls, so the bun process and its
# dependencies never see it. Egress is permissive because the same verbs call
# gh: other hosts get an uninspected tunnel, and no secret goes there.
[proxy]
egress = "permissive"

[[proxy.rules]]
secret = "CF_TOKEN_ADMIN"
domain = "api.cloudflare.com"
header = "authorization"
methods = ["GET", "POST", "PUT", "DELETE"]
paths = ["/client/v4/**"]
