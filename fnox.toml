# Secrets the repo tooling needs, declared without their values (fnox:
# https://github.com/jdx/fnox, installed by mise). `cf-admin` defaults to the
# macOS Keychain; to use another backend (age, a password manager...), redefine
# [providers.cf-admin] in a gitignored fnox.local.toml. See CONTRIBUTING.md
# "Cloudflare deploy tokens as code". Nothing here is secret.

[providers.cf-admin]
type = "keychain"
service = "fnox"

[secrets]
CF_TOKEN_ADMIN= { provider = "cf-admin", value = "voidflow-cf-token-admin", description = "User-owned Cloudflare admin token for voidflow plan|apply tokens in a repo whose voidflow.config.ts cloudflare section uses this variable: Account API Tokens Edit, Workers Scripts Read, Zone Read on its account. Local only, never CI.", if_missing = "error" }
