# Shared git hooks for any bun repo (or pnpm, when the repo has a
# pnpm-lock.yaml, or aube, when package.json's `packageManager` is aube). Repos pull this in as a lefthook remote and call their own
# package.json scripts, so a script a repo does not define is skipped
# (`<pm> run --if-present`).
#
#   # lefthook.yml in the repo
#   remotes:
#     - git_url: https://github.com/taraxvoid/voidflow
#       ref: <release tag>       # a tag or branch (not a SHA); bump deliberately
#       configs:
#         - lefthook/base.yml
#
# Lefthook merges lefthook.yml < remotes < lefthook-local.yml, so a repo's own
# lefthook.yml can ADD commands (e.g. image compression) but cannot override
# one defined here. Differences go through package.json scripts instead, e.g.
# `test:unit:precommit` replaces `test:unit` for the pre-commit unit step, and
# `check:precommit` replaces `check` for the typecheck step.
#
# Git exports GIT_DIR, GIT_INDEX_FILE and others to hooks. Steps that run tests
# unset them first (git lists them itself), so tests that spawn git in a temp
# repo don't act on this one.

templates:
  # Package manager: aube when `packageManager` names it (it shares
  # pnpm-lock.yaml, so check it first), pnpm when the repo is a pnpm project,
  # bun otherwise.
  pm: "$(if grep -q 'packageManager.*aube@' package.json 2>/dev/null; then echo aube; elif [ -f pnpm-lock.yaml ]; then echo pnpm; else echo bun; fi)"

pre-commit:
  skip: [merge, rebase]
  commands:
    deps-installed:
      priority: 1
      # Every later step is skipped while node_modules is missing (the
      # no-deps skip anchor on biome-version), so this message is the only output instead of a pile
      # of 'command not found' failures.
      run: |
        if [ ! -d node_modules ]; then
          echo "pre-commit: 'node_modules' is missing, dependencies aren't installed."
          echo "            Run '{pm} install' before committing, then commit again."
          exit 1
        fi
    biome-version:
      skip: &no-deps
        - run: test ! -d node_modules
      priority: 2
      # Advisory only: Biome 1.x can't extend the shared config
      # (@taraxvoid/voidflow/biome), so nudge the repo toward 2.x.
      run: |
        v=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' node_modules/@biomejs/biome/package.json 2>/dev/null | head -n1)
        case "$v" in
          1.*)
            echo "pre-commit: Biome $v is installed; voidflow's shared config (@taraxvoid/voidflow/biome) needs Biome 2."
            echo "            Upgrade with '{pm} add -D @biomejs/biome@^2', then '{pm} run biome migrate --write'."
            ;;
        esac
        exit 0
    format:
      skip: *no-deps
      priority: 2
      run: "{pm} run --if-present format"
      stage_fixed: true
    lint-actions:
      skip: *no-deps
      priority: 3
      run: "{pm} run --if-present lint:actions"
    typecheck:
      skip: *no-deps
      priority: 3
      # A repo that can check less than everything pre-commit (e.g. only the
      # workspace packages a commit touches) defines `check:precommit`;
      # otherwise check runs. CI keeps calling `check` directly.
      run: |
        if grep -q '"check:precommit"' package.json; then
          {pm} run check:precommit
        else
          {pm} run --if-present check
        fi
    unit:
      skip: *no-deps
      priority: 3
      # A repo that can't run its whole suite pre-commit (e.g. tests that need
      # a built dist/) defines `test:unit:precommit`; otherwise test:unit runs.
      run: |
        unset $(git rev-parse --local-env-vars)
        if grep -q '"test:unit:precommit"' package.json; then
          {pm} run test:unit:precommit
        else
          {pm} run --if-present test:unit
        fi
    licenses:
      skip: *no-deps
      priority: 3
      glob: "{package.json,bun.lock,pnpm-lock.yaml}"
      run: "{pm} run --if-present check:licenses"
    audit:
      skip: *no-deps
      # Local only: hits a remote vulnerability database and can hang offline,
      # so it runs when dependencies changed and fails closed.
      priority: 3
      glob: "{package.json,bun.lock,pnpm-lock.yaml}"
      # Checked by hand: under bun, `--if-present` falls through to
      # the system `audit` binary (macOS /usr/sbin/audit) when the site has no
      # audit script, and that exits non-zero.
      run: |
        if grep -q '"audit"' package.json; then
          {pm} run audit
        fi

commit-msg:
  commands:
    conventional-commit-hint:
      # Advisory only: prints a nudge toward Conventional Commits, never blocks.
      run: |
        first_line=$(head -n1 "{1}")
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
        if ! printf '%s' "$first_line" | grep -Eq "$pattern"; then
          echo ""
          echo "commit-msg: this commit message doesn't look like a Conventional Commit."
          echo "            (just a heads-up; the commit still went through)"
          echo ""
          echo '  e.g. "feat: add newsletter signup" or "fix(ical): correct dtstart offset"'
          echo "  see https://www.conventionalcommits.org for the full format"
          echo ""
        fi
        exit 0

pre-push:
  commands:
    sync:
      priority: 1
      # Git-only guards, so they run everywhere, Claude's sandboxed pre-push
      # check included: stop when the remote branch is ahead or dependencies
      # are missing.
      use_stdin: true
      run: |
        # Nothing new to push (branch delete, or a tag or branch pointing at
        # commits the remote already has): skip the checks. A commit counts
        # as new when no ref of the remote contains it.
        has_new_commits=false
        remote_name="{1}"
        remote_branch=""
        while read -r _local_ref local_sha remote_ref _remote_sha; do
          # An all-zero local sha is a delete.
          case "$local_sha" in *[!0]*) ;; *) continue ;; esac
          if [ -z "$(git rev-list -n 1 "$local_sha" --not --remotes="$remote_name" 2>/dev/null)" ]; then
            continue
          fi
          has_new_commits=true
          case "$remote_ref" in refs/heads/*) remote_branch="${remote_ref#refs/heads/}" ;; esac
        done
        if [ "$has_new_commits" = false ]; then
          echo "pre-push: no new commits to push, skipping checks"
          exit 0
        fi

        # Bail early if the remote branch has commits we don't have.
        if [ -n "$remote_name" ] && [ -n "$remote_branch" ]; then
          if git fetch "$remote_name" "$remote_branch" --quiet 2>/dev/null; then
            fetch_head=$(git rev-parse FETCH_HEAD 2>/dev/null) || true
            local_head=$(git rev-parse HEAD)
            if [ -n "$fetch_head" ] && [ "$fetch_head" != "$local_head" ]; then
              merge_base=$(git merge-base HEAD "$fetch_head" 2>/dev/null) || true
              if [ -n "$merge_base" ] && [ "$merge_base" != "$fetch_head" ]; then
                echo "pre-push: remote has commits not in local branch, pull or rebase before pushing"
                exit 1
              fi
            fi
          fi
        fi

        if [ ! -d node_modules ]; then
          echo "pre-push: 'node_modules' is missing, dependencies aren't installed."
          echo "          Run '{pm} install' before pushing, then push again."
          exit 1
        fi
    test:
      priority: 2
      # Tagged ci: the test run (Playwright e2e, builds) cannot run in Claude's
      # sandboxed pre-push check (LEFTHOOK_EXCLUDE=ci), so it leaves tests to
      # CI. Pushes from your own shell still run them. Only the test run lives
      # here; guards that can run sandboxed belong in `sync`. Skipped without
      # node_modules, which `sync` reports.
      tags: [ci]
      skip: *no-deps
      use_stdin: true
      run: |
        # Nothing new to push (branch delete, or a tag or branch pointing at
        # commits the remote already has): skip the checks. A commit counts
        # as new when no ref of the remote contains it.
        has_new_commits=false
        remote_name="{1}"
        while read -r _local_ref local_sha _remote_ref _remote_sha; do
          case "$local_sha" in *[!0]*) ;; *) continue ;; esac
          if [ -n "$(git rev-list -n 1 "$local_sha" --not --remotes="$remote_name" 2>/dev/null)" ]; then
            has_new_commits=true
          fi
        done
        [ "$has_new_commits" = true ] || exit 0

        unset $(git rev-parse --local-env-vars)
        {pm} run --if-present test:push
    voidflow-sync:
      # Pushes whose new commits change voidflow.config.ts, on any branch: the
      # file must validate (a bad one blocks the push), and the plan of what
      # `voidflow apply` would change is printed, never blocking. Applying
      # stays a manual step after merge; drift on main is the voidflow-drift
      # workflow's to report. Skipped without the file, the check:voidflow
      # script or an installed voidflow bin.
      #   try:deploy      optional repo script, e.g. `voidflow try tokens
      #                   prod -- bunx wrangler deploy --dry-run`; proves the
      #                   token policies are enough. Guard it on the admin
      #                   token being set.
      use_stdin: true
      run: |
        [ -f voidflow.config.ts ] || exit 0
        grep -q '"check:voidflow"' package.json || exit 0
        vf=./node_modules/.bin/voidflow
        [ -x "$vf" ] || exit 0
        changed=false
        other=false
        head=$(git rev-parse HEAD)
        while read -r _local_ref local_sha _remote_ref _remote_sha; do
          case "$local_sha" in *[!0]*) ;; *) continue ;; esac
          # A commit counts as new when no ref of the remote contains it.
          if [ -n "$(git log -n 1 --format=%H "$local_sha" --not --remotes="{1}" -- voidflow.config.ts 2>/dev/null)" ]; then
            if [ "$local_sha" = "$head" ]; then changed=true; else other=true; fi
          fi
        done
        if [ "$other" = true ]; then
          echo "pre-push: voidflow.config.ts changes in a commit that is not checked out; not checked here (CI validates it)."
        fi
        [ "$changed" = true ] || exit 0
        if ! git diff --quiet HEAD -- voidflow.config.ts; then
          echo "pre-push: voidflow.config.ts has uncommitted changes; not checked here (CI validates the pushed commit)."
          exit 0
        fi
        unset $(git rev-parse --local-env-vars)
        code=0
        "$vf" validate || code=$?
        if [ "$code" != 0 ]; then
          echo "pre-push: voidflow.config.ts does not validate (see above); fix it before pushing."
          exit 1
        fi
        "$vf" plan || echo "pre-push: voidflow plan did not finish (see above), not blocking the push."
        {pm} run --if-present try:deploy
