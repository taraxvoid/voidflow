# Renamed to lefthook/base.yml. Change the voidflow remote's `configs` entry
# in your lefthook.yml:
#
#   configs:
#     - lefthook/base.yml
#
# This stub stays because a `ref` bump (e.g. Renovate's) leaves `configs`
# untouched, and lefthook skips a missing remote config without a warning, so
# a plain rename would turn every hook off silently. Instead, commits and
# pushes fail with the fix until the entry is updated.

pre-commit:
  commands:
    voidflow-site-yml-renamed:
      run: &renamed |
        echo "voidflow: lefthook/site.yml was renamed to lefthook/base.yml." >&2
        echo "          Change the voidflow remote's configs entry in lefthook.yml to lefthook/base.yml." >&2
        exit 1

pre-push:
  commands:
    sync-and-test:
      use_stdin: true
      run: |
        # Nothing new to push (branch delete, or a tag or branch pointing at
        # commits the remote already has): skip the checks. A commit counts
        # as new when no ref of the remote contains it.
        has_new_commits=false
        remote_name="{1}"
        remote_branch=""
        while read -r _local_ref local_sha remote_ref _remote_sha; do
          # An all-zero local sha is a delete.
          case "$local_sha" in *[!0]*) ;; *) continue ;; esac
          if [ -z "$(git rev-list -n 1 "$local_sha" --not --remotes="$remote_name" 2>/dev/null)" ]; then
            continue
          fi
          has_new_commits=true
          case "$remote_ref" in refs/heads/*) remote_branch="${remote_ref#refs/heads/}" ;; esac
        done
        if [ "$has_new_commits" = false ]; then
          echo "pre-push: no new commits to push, skipping checks"
          exit 0
        fi

        # Bail early if the remote branch has commits we don't have.
        if [ -n "$remote_name" ] && [ -n "$remote_branch" ]; then
          if git fetch "$remote_name" "$remote_branch" --quiet 2>/dev/null; then
            fetch_head=$(git rev-parse FETCH_HEAD 2>/dev/null) || true
            local_head=$(git rev-parse HEAD)
            if [ -n "$fetch_head" ] && [ "$fetch_head" != "$local_head" ]; then
              merge_base=$(git merge-base HEAD "$fetch_head" 2>/dev/null) || true
              if [ -n "$merge_base" ] && [ "$merge_base" != "$fetch_head" ]; then
                echo "pre-push: remote has commits not in local branch, pull or rebase before pushing"
                exit 1
              fi
            fi
          fi
        fi

        if [ ! -d node_modules ]; then
          echo "pre-push: 'node_modules' is missing, dependencies aren't installed."
          echo "          Run '{pm} install' before pushing, then push again."
          exit 1
        fi

        {pm} run --if-present test:push
