[install]
minimumReleaseAge = 259200 # 3 days

# Packages that bypass the gate
minimumReleaseAgeExcludes = ["@playwright/test", "playwright", "playwright-core"]

[install.security]
scanner = "@socketsecurity/bun-security-scanner"

[test]
# Fail with one clear message when `bun install` hasn't run (see the file).
preload = ["./test/require-deps.ts"]
