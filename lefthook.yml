pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,mjs,json}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    jactionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: just lint-workflows
    schema-validation:
      glob: "{actions/**/action.{yml,yaml},.github/workflows/*.{yml,yaml}}"
      run: just lint-actions
    shellcheck-actions:
      glob: "actions/**/action.{yml,yaml}"
      run: just lint-shell

commit-msg:
  commands:
    conventional-commit-hint:
      run: scripts/check-commit-msg.sh {1}

pre-push:
  parallel: true
  commands:
    zizmor:
      run: just security
    test:
      # Git exports GIT_DIR, GIT_INDEX_FILE and others to hooks; clear them so
      # tests that run git in temp repos can't touch this one.
      run: |
        unset $(git rev-parse --local-env-vars)
        bun test
