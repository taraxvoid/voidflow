name: CI

on:
  push:
    branches: [main]
  pull_request:
      types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  
jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: jactionlint
        run: |
          tarball="jactionlint_${VERSION}_linux_amd64.tar.gz"
          gh release download --repo jdx/jactionlint --pattern "$tarball" "v$VERSION" --dir "$RUNNER_TEMP"
          gh attestation verify -R jdx/jactionlint "$RUNNER_TEMP/$tarball"
          tar xf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" jactionlint
          "$RUNNER_TEMP/jactionlint" --color
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 2.3.0 # renovate: datasource=github-releases depName=jdx/jactionlint

      # shellcheck ships on ubuntu-latest; jactionlint also picks it up from PATH
      - uses: oven-sh/setup-bun@v2.2.0

      - name: Shellcheck composite action scripts
        run: bun scripts/shellcheck-actions.ts

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # No Python deps in this repo; uvx tool versions are pinned in this file.
          cache-dependency-glob: .github/workflows/ci.yml

      - name: Validate action.yml schemas
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files -- 'actions/**/action.yml' 'actions/**/action.yaml')
          uvx check-jsonschema@0.38.0 --builtin-schema vendor.github-actions "${files[@]}"

      - name: Validate workflow schemas
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          uvx check-jsonschema@0.38.0 --builtin-schema vendor.github-workflows "${files[@]}"

      # The agentic package ships Markdown that consumers compile; compile it
      # here (strict, nothing written) so a broken frontmatter never releases.
      # Same gh-aw pin as agentic-locks.yml's default (test/agentic.test.ts).
      - name: Compile agentic package
        run: |
          gh extension install github/gh-aw --pin "$GH_AW_VERSION"
          cp agentic/workflows/*.md .github/workflows/
          gh aw compile --strict --no-emit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_VERSION: v1.0.1

      - name: zizmor (security)
        run: uvx zizmor@1.32.0 --min-severity medium .
        env:
          GH_TOKEN: ${{ github.token }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: ./actions/bun-install

      # test/cli.test.ts runs the built voidflow bin under Node too (engines:
      # node >=24) and fails under CI when node is missing or can't strip types.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - run: bun run test

      - name: voidflow config
        # The config must load and validate (exit 2 fails the job). What
        # applying it would change goes to the job summary and never fails:
        # a PR that changes the config is applied after merge, and drift on
        # main is the voidflow-drift workflow's to report. Tokens are never
        # planned here (CI has no admin token).
        run: |
          vf() { bun scripts/cli.ts "$@"; }
          vf validate
          code=0
          vf plan --no-color > "$RUNNER_TEMP/voidflow-plan.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/voidflow-plan.txt"
          {
            echo '### voidflow plan'
            echo
            echo 'What voidflow apply would change for this voidflow.config.ts. Drift does not fail CI: apply after merging, from main.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/voidflow-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            echo "::warning::voidflow plan exited $code (1: a read failed, 2: the default token cannot read something); see the job summary"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
