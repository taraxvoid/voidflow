name: CI

on:
  push:
    branches: [main, next]
  pull_request:
      types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  
jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: jactionlint
        run: |
          tarball="jactionlint_${VERSION}_linux_amd64.tar.gz"
          gh release download --repo jdx/jactionlint --pattern "$tarball" "v$VERSION" --dir "$RUNNER_TEMP"
          gh attestation verify -R jdx/jactionlint "$RUNNER_TEMP/$tarball"
          tar xf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" jactionlint
          "$RUNNER_TEMP/jactionlint" --color
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 2.3.0 # renovate: datasource=github-releases depName=jdx/jactionlint

      # shellcheck ships on ubuntu-latest; jactionlint also picks it up from PATH
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # A PR into main that carries next's commits must come from `just promote`
      # (head next, auto-merged with a merge commit). A squashed hand-made
      # promotion (#185) left main without next's history and broke every
      # back-merge after it.
      - name: Promotion guard
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet --no-tags --unshallow origin main next
          bun scripts/promotion-guard.ts --head-ref "$HEAD_REF" --head "$HEAD_SHA"

      - name: Shellcheck composite action scripts
        run: bun scripts/shellcheck-actions.ts

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # No Python deps in this repo; uvx tool versions are pinned in this file.
          cache-dependency-glob: .github/workflows/ci.yml

      - name: Validate action.yml schemas
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files -- 'actions/**/action.yml' 'actions/**/action.yaml')
          uvx check-jsonschema@0.38.0 --builtin-schema vendor.github-actions "${files[@]}"

      - name: Validate workflow schemas
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          uvx check-jsonschema@0.38.0 --builtin-schema vendor.github-workflows "${files[@]}"

      - name: zizmor (security)
        run: uvx zizmor@1.30.1 --min-severity medium .
        env:
          GH_TOKEN: ${{ github.token }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./actions/bun-install

      # test/cli.test.ts runs the built voidflow bin under Node too (engines:
      # node >=24) and fails under CI when node is missing or can't strip types.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun test
