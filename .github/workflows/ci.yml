name: CI

on:
  push:
    branches: [main, next]
  pull_request:
      types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  
jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          gh release download --repo rhysd/actionlint --pattern '*_linux_amd64.tar.gz' v1.7.12 --dir "$RUNNER_TEMP"
          gh attestation verify -R rhysd/actionlint "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          tar xf "$RUNNER_TEMP"/actionlint_1.7.12_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
        env:
          GH_TOKEN: ${{ github.token }}

      # shellcheck ships on ubuntu-latest; actionlint also picks it up from PATH
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Shellcheck composite action scripts
        run: bun scripts/shellcheck-actions.ts

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # No Python deps in this repo; uvx tool versions are pinned in this file.
          cache-dependency-glob: .github/workflows/ci.yml

      - name: Validate action.yml schemas
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files -- 'actions/**/action.yml' 'actions/**/action.yaml')
          uvx check-jsonschema@0.38.0 --builtin-schema vendor.github-actions "${files[@]}"

      - name: Validate workflow schemas
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          uvx check-jsonschema@0.38.0 --builtin-schema vendor.github-workflows "${files[@]}"

      - name: zizmor (security)
        run: uvx zizmor@1.30.1 --min-severity medium .
        env:
          GH_TOKEN: ${{ github.token }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./actions/bun-install

      - run: bun test
