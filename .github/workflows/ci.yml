name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7/scripts/download-actionlint.bash \
            | bash -s -- 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
        # shellcheck is preinstalled on ubuntu-latest; actionlint auto-detects
        # it and lints run: steps in .github/workflows/*.yml for free.

      - name: Validate action.yml / workflow schemas
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d # v0.9.0
        with:
          patterns: |
            :(glob)actions/**/action.yml
            :(glob)actions/**/action.yaml
            .github/workflows/*.yml
            .github/workflows/*.yaml

      - name: Install yq
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Shellcheck composite action scripts
        run: ./scripts/shellcheck-actions.sh

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: zizmor (security)
        run: uvx zizmor@1.30.1 --min-severity medium .
        env:
          GH_TOKEN: ${{ github.token }}
