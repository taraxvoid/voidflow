name: Validation

# Validation job for sites using a Astro/bun/Playwright stack
# for self-hosted runners pass `runner`
# Callers need pull_request/workflow_dispatch triggers 
# Caller is expected to define referenced package.json scripts

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label for the validate job. Defaults to a GitHub-hosted
          runner; pass a self-hosted label (e.g. 'my-hosted-runner')
        type: string
        default: ubuntu-latest

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sharp edge: gitleaks requires full commit history
          persist-credentials: false

      - name: Secrets Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            lockfile:
              - 'bun.lock'
            scripts:
              - 'scripts/**'
            workflows:
              - '.github/workflows/**'
            e2e_relevant:
              - 'src/**'
              - 'public/**'
              - 'test/**'
              - 'astro.config.ts'
              - 'playwright.config.js'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - '.github/workflows/**'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # XXX holding off on pinning here until 1.4.x is stable
        # in caller: specify version in package.json or .bun-version to override
        # falls through to 'latest' if not provided
        # with:
          # bun-version: 1.4.2
          # bun-version-file: ".bun-version"
          
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'playwright.config.js', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install NPM Dependencies
        run: bun install --frozen-lockfile

      - name: Lint CI workflows
        if: steps.changes.outputs.workflows == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7/scripts/download-actionlint.bash \
            | bash -s -- 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
        shell: bash
        
      - name: Lint Code
        run: bun run lint

      - name: TypeCheck Code
        run: bun run check

      - name: Build Code
        run: bun run build

      - name: Unit Tests
        run: bun run test:unit

      - name: Check Licenses for GPL kudzu
        if: steps.changes.outputs.lockfile == 'true' || steps.changes.outputs.scripts == 'true'
        run: bun run check:licenses

      - name: Install Playwright
        if: steps.changes.outputs.e2e_relevant == 'true'
        run: npx playwright install --with-deps chromium # npx has better compat than bunx for this

      - name: E2E - Dev
        if: steps.changes.outputs.e2e_relevant == 'true' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: bun run test:e2e:full

      - name: E2E - Staging
        if: steps.changes.outputs.e2e_relevant == 'true' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'next'
        run: |
          bun run test:e2e:all
          bun run test:e2e:a11y

      - name: E2E - Production
        if: steps.changes.outputs.e2e_relevant == 'true' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'live'
        run: |
          bun run test:e2e:all
          bun run test:e2e:a11y
          bun run test:e2e:lighthouse

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports
          path: |
            playwright-report/
            test-results/
