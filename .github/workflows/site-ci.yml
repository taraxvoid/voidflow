name: Validation

# Validation job for sites using a Astro/Playwright stack (bun, pnpm or aube)
# for self-hosted runners pass `runner`
# Callers need pull_request/workflow_dispatch triggers, plus push on main
# so direct pushes are validated too
# Caller is expected to define referenced package.json scripts
#
# The secrets scan and changed-file filter run first; later steps are gated on
# the `decide` step, so a pull request that only touches docs stops after the
# scan and still reports success. Pushes and manual runs always validate.

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label for the validate job. Defaults to a GitHub-hosted
          runner; pass a self-hosted label (e.g. 'my-hosted-runner')
        type: string
        default: ubuntu-latest
      playwright-install-with-deps:
        description: >
          Whether the Playwright install step also apt-installs OS-level
          browser deps via sudo (`--with-deps`). GitHub-hosted runners need
          this. Self-hosted runners with those deps already baked into the
          image should pass `false` -- some runner containers set
          no-new-privileges, which makes sudo (and so --with-deps) fail
          outright.
        type: boolean
        default: true
      package-manager:
        description: >
          Package manager for setup, dependency cache, install and every
          script call: 'bun', 'pnpm' or 'aube'. For pnpm the pnpm version comes
          from `packageManager` in package.json and Node from `volta` /
          `engines` in package.json. For aube the caller's mise.toml installs
          aube, which re-execs the `packageManager` version and resolves Node
          from `devEngines.runtime`. The lockfile name follows (bun.lock, or
          pnpm-lock.yaml for pnpm and aube).
        type: string
        default: bun
      code-paths:
        description: >
          JSON array of globs (with `!` excludes) that decide whether a pull
          request needs install, lint and tests. A PR whose changed files all
          match an exclude only gets the secrets scan. The default skips
          Markdown, docs/, LICENSE and issue templates.
        type: string
        default: '["**", "!**/*.md", "!docs/**", "!LICENSE*", "!.github/ISSUE_TEMPLATE/**"]'
      e2e-scripts:
        description: >
          JSON array of extra package.json script names to run, in order,
          after the built-in e2e tiers whenever e2e-relevant files changed,
          e.g. '["test:e2e", "test:e2e:gtm"]'. Unlike the built-in tiers, a
          listed script that is missing fails the job.
        type: string
        default: '[]'
      build:
        description: >
          Run the `build` script as its own step. Pass false when the e2e
          scripts already build, to avoid building twice.
        type: boolean
        default: true
      e2e-extra-paths:
        description: >
          JSON array of extra globs that count as e2e-relevant changes, on top
          of the built-in src/, public/, test/, scripts/, astro/playwright
          config, package.json, lockfile, tsconfig.json and workflows.
        type: string
        default: '["wrangler.jsonc", "site.vars.json"]'
      build-env:
        description: >
          JSON object of environment variables for the build step, e.g.
          '{"PUBLIC_SITE_URL": "https://example.com", "GIT_SHA": "abc"}'.
          Build the string in the caller with toJSON/format. Not for secrets
          (inputs are visible in logs).
        type: string
        default: '{}'
      socket-scanner:
        description: >
          Run the bunfig.toml install-time security scanner (`[install.security]
          scanner`, e.g. Socket's) during the CI install. Defaults to false: it
          calls a third-party API on every install and can fail a build for
          reasons outside the repo. It still runs on local installs. Bun only;
          ignored for pnpm.
        type: boolean
        default: false
    secrets:
      GITLEAKS_LICENSE:
        description: >
          Deprecated and unused: the scan now uses the OSS gitleaks binary, which needs
          no license. Kept so existing callers that pass it don't fail. Formerly: optional
          gitleaks Organization license (gitleaks.io). Cross-account
          `secrets: inherit` doesn't reliably forward repo secrets to a
          reusable workflow owned by a different account, so callers on a
          gitleaks Organization plan should pass this explicitly via
          `secrets: { GITLEAKS_LICENSE: secrets.GITLEAKS_LICENSE }` (wrapped
          in the caller's own expression syntax).
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR pushes are cancelled: on trunk, a second quick merge to
  # main must not cancel the first one's validation (and so its deploy).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      PM: ${{ inputs.package-manager }}
      LOCKFILE: ${{ inputs.package-manager == 'bun' && 'bun.lock' || 'pnpm-lock.yaml' }}
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sharp edge: gitleaks requires full commit history
          persist-credentials: false

      - name: Secrets Scan
        # OSS gitleaks binary: the gitleaks-action wrapper needs a paid license for orgs.
        # Scans full history; known findings live in the caller's .gitleaksignore.
        run: |
          version=8.30.1
          case "$(uname -m)" in
            x86_64) arch=x64; sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64|arm64) arch=arm64; sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="gitleaks_${version}_linux_${arch}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "${sha}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          # Redacted SARIF for upload-sarif.yml; the scan still fails on findings.
          mkdir -p "$RUNNER_TEMP/sarif"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --report-format sarif --report-path "$RUNNER_TEMP/sarif/gitleaks.sarif" .
        shell: bash

      - name: Check package manager
        run: |
          case "$PM" in
            bun | pnpm | aube) ;;
            *) echo "::error::package-manager must be 'bun', 'pnpm' or 'aube', got '$PM'" >&2; exit 1 ;;
          esac

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          # Lets `code` below use `!` excludes; the other filters have none, so
          # they match as before.
          predicate-quantifier: some-with-excludes
          filters: |
            code: ${{ inputs.code-paths }}
            lockfile:
              - '${{ env.LOCKFILE }}'
            scripts:
              - 'scripts/**'
            workflows:
              - '.github/workflows/**'
            e2e_relevant:
              - 'src/**'
              - 'public/**'
              - 'test/**'
              - 'scripts/**'
              - 'astro.config.*'
              - 'playwright.config.*'
              - 'package.json'
              - '${{ env.LOCKFILE }}'
              - 'tsconfig.json'
              - '.github/workflows/**'
            e2e_extra: ${{ inputs.e2e-extra-paths }}

      - name: Resolve e2e relevance
        id: e2e
        run: echo "relevant=$([[ "$MAIN" == true || "$EXTRA" == true ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          MAIN: ${{ steps.changes.outputs.e2e_relevant }}
          EXTRA: ${{ steps.changes.outputs.e2e_extra }}

      - name: Decide whether to validate
        id: decide
        # Only pull requests are filtered. Pushes and manual runs have no
        # reliable base to diff against, and a caller's deploy job needs a
        # validate that ran.
        run: |
          if [[ "$EVENT" == pull_request* && "$CODE" != true ]]; then
            echo "::notice::Only docs changed; skipping validate."
            echo "validate=false" >> "$GITHUB_OUTPUT"
          else
            echo "validate=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.changes.outputs.code }}
      - name: Setup Bun
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # XXX holding off on pinning here until 1.4.x is stable
        # in caller: specify version in package.json or .bun-version to override
        # falls through to 'latest' if not provided
        # with:
          # bun-version: 1.4.2
          # bun-version-file: ".bun-version"

      - name: Setup pnpm
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # pnpm version comes from `packageManager` in the caller's package.json

      - name: Setup Node (pnpm)
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'pnpm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # reads `volta` / `engines`
          cache: pnpm

      # aube comes from the caller's mise.toml (`aube = "<version>"`); aube then
      # re-execs the `packageManager` version and resolves Node from
      # `devEngines.runtime`, installing it through mise. cache_save_post keeps
      # that Node in the mise cache.
      - name: Setup aube
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'aube'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache_save_post: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'aube'
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-store-${{ hashFiles(env.LOCKFILE) }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'bun'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(env.LOCKFILE) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Same script as actions/bun-install (a test keeps them identical).
      # Inlined because a reusable workflow can't reach `./actions/...` in its
      # own repo: checkout gives it the caller's tree, not voidflow's.
      - name: Install NPM Dependencies (bun)
        id: install
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'bun'
        shell: bash
        env:
          SOCKET_SCANNER: ${{ inputs.socket-scanner }}
        run: |
          # Removes the scanner line as text, then checks the result with a real
          # TOML parse: it must equal the original minus install.security.scanner.
          # Anything that can't be removed that way fails the install instead of
          # running the scanner, or skipping it, silently.
          # shellcheck disable=SC2016 # JS source; the ${...} in it is for bun, not bash
          strip_scanner='
          const src = await Bun.file("bunfig.toml").text()
          const parse = (text) => { try { return Bun.TOML.parse(text) } catch (e) { console.log(`::error file=bunfig.toml::Could not parse bunfig.toml: ${e.message}`); process.exit(1) } }
          const original = parse(src)
          if (original.install?.security?.scanner === undefined) process.exit(10)
          const key = /^\s*((install\.)?security\.)?("scanner"|scanner)\s*=/
          const stripped = src.split("\n").filter((line) => !key.test(line)).join("\n")
          // empty tables left behind by the removal count as absent
          const prune = (cfg) => {
            delete cfg.install?.security?.scanner
            if (cfg.install?.security && Object.keys(cfg.install.security).length === 0) delete cfg.install.security
            if (cfg.install && Object.keys(cfg.install).length === 0) delete cfg.install
            return cfg
          }
          const after = parse(stripped)
          if (after.install?.security?.scanner !== undefined || !Bun.deepEquals(prune(after), prune(structuredClone(original)))) {
            console.log("::error file=bunfig.toml::Could not remove the security scanner from bunfig.toml cleanly; set it as `scanner = \"...\"` under [install.security].")
            process.exit(1)
          }
          await Bun.write(process.env.BUNFIG_OUT, stripped)
          '
          if [[ "$SOCKET_SCANNER" != "true" ]] && [[ -f bunfig.toml ]]; then
            config="$RUNNER_TEMP/bunfig.toml"
            rc=0
            BUNFIG_OUT="$config" bun --config=/dev/null -e "$strip_scanner" || rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "::notice file=bunfig.toml::Security scanner skipped in CI. Pass socket-scanner: true to run it here; it still runs on local installs."
              bun install --frozen-lockfile --config="$config"
              exit
            elif [[ $rc -ne 10 ]]; then
              exit "$rc"
            fi
          fi
          bun install --frozen-lockfile

      - name: Install NPM Dependencies (pnpm)
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install NPM Dependencies (aube)
        if: steps.decide.outputs.validate == 'true' && inputs.package-manager == 'aube'
        # Frozen lockfile: fails if pnpm-lock.yaml is out of date with package.json.
        run: aube ci

      - name: Detect package scripts
        id: scripts
        if: steps.decide.outputs.validate == 'true'
        # Fail open: a check whose script the caller doesn't define is skipped, not failed.
        run: |
          for name in lint check build test:unit check:licenses test:e2e:all test:e2e:a11y test:e2e:lighthouse; do
            if jq -e --arg n "$name" '.scripts // {} | has($n)' package.json >/dev/null; then
              echo "${name//:/_}=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Skipping '$name': no such script in package.json"
            fi
          done

      - name: Lint CI workflows
        if: steps.decide.outputs.validate == 'true' && steps.changes.outputs.workflows == 'true'
        # jactionlint's default profile adds rules actionlint never had, so a
        # caller gets actionlint's checks (--profile correctness) unless its
        # .github/jactionlint.yaml (or actionlint.yaml) opts in with `profile:`.
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::No jactionlint build for runner arch $RUNNER_ARCH"; exit 1 ;;
          esac
          tarball="jactionlint_${VERSION}_linux_${arch}.tar.gz"
          gh release download --repo jdx/jactionlint --pattern "$tarball" "v$VERSION" --dir "$RUNNER_TEMP"
          gh attestation verify -R jdx/jactionlint "$RUNNER_TEMP/$tarball"
          tar xf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" jactionlint
          args=(--color)
          if ! grep -qs '^profile:' .github/jactionlint.yaml .github/jactionlint.yml .github/actionlint.yaml .github/actionlint.yml 2>/dev/null; then
            args+=(--profile correctness)
          fi
          "$RUNNER_TEMP/jactionlint" "${args[@]}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 2.1.0

      - name: Check Biome version
        if: steps.decide.outputs.validate == 'true' && steps.scripts.outputs.lint == 'true'
        # Advisory only: Biome 1.x can't extend the shared config
        # (@taraxvoid/voidflow/biome).
        run: |
          v=$(jq -r '.version // empty' node_modules/@biomejs/biome/package.json 2>/dev/null || true)
          if [[ "$v" == 1.* ]]; then
            echo "::warning file=package.json::Biome $v is installed. voidflow's shared config (@taraxvoid/voidflow/biome) needs Biome 2."
          fi
        shell: bash

      - name: Lint Code
        if: steps.decide.outputs.validate == 'true' && steps.scripts.outputs.lint == 'true'
        run: '"$PM" run lint'

      - name: TypeCheck Code
        if: steps.decide.outputs.validate == 'true' && steps.scripts.outputs.check == 'true'
        run: '"$PM" run check'

      - name: Build Code
        if: steps.decide.outputs.validate == 'true' && steps.scripts.outputs.build == 'true' && inputs.build
        run: '"$PM" run build'
        env: ${{ fromJSON(inputs.build-env) }}

      - name: Unit Tests
        if: steps.decide.outputs.validate == 'true' && steps.scripts.outputs.test_unit == 'true'
        run: '"$PM" run test:unit'

      - name: Check Licenses for GPL kudzu
        if: steps.decide.outputs.validate == 'true' && (steps.scripts.outputs.check_licenses == 'true' && (steps.changes.outputs.lockfile == 'true' || steps.changes.outputs.scripts == 'true'))
        run: '"$PM" run check:licenses'

      # Keyed on the installed Playwright version, not the lockfile: an
      # unrelated dependency bump no longer throws the browsers away, and a
      # Playwright bump (new browser revision) always misses.
      - name: Resolve Playwright version
        id: playwright
        if: steps.decide.outputs.validate == 'true' && steps.e2e.outputs.relevant == 'true'
        run: |
          version=$(jq -r '.version // "unknown"' node_modules/@playwright/test/package.json 2>/dev/null || echo unknown)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.decide.outputs.validate == 'true' && steps.e2e.outputs.relevant == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright
        if: steps.decide.outputs.validate == 'true' && steps.e2e.outputs.relevant == 'true'
        # npx has better compat than bunx for this; aube has no Node on PATH,
        # so it goes through `aube exec`.
        run: |
          deps=()
          if [[ "$WITH_DEPS" == true ]]; then deps=(--with-deps); fi
          if [[ "$PM" == aube ]]; then
            aube exec playwright install "${deps[@]}" chromium
          else
            npx playwright install "${deps[@]}" chromium
          fi
        env:
          WITH_DEPS: ${{ inputs.playwright-install-with-deps }}

      - name: E2E
        if: steps.decide.outputs.validate == 'true' && (steps.scripts.outputs.test_e2e_all == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push'))
        run: '"$PM" run test:e2e:all'

      - name: E2E - Accessibility
        if: steps.decide.outputs.validate == 'true' && (steps.scripts.outputs.test_e2e_a11y == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push'))
        run: '"$PM" run test:e2e:a11y'

      - name: E2E - Lighthouse
        if: steps.decide.outputs.validate == 'true' && (steps.scripts.outputs.test_e2e_lighthouse == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push'))
        run: '"$PM" run test:e2e:lighthouse'

      - name: E2E - Extra scripts
        if: steps.decide.outputs.validate == 'true' && steps.e2e.outputs.relevant == 'true' && inputs.e2e-scripts != '[]'
        run: |
          while IFS= read -r name; do
            "$PM" run "$name"
          done < <(jq -r '.[]' <<< "$SCRIPTS")
        env:
          SCRIPTS: ${{ inputs.e2e-scripts }}

      - name: Upload failure reports
        if: steps.decide.outputs.validate == 'true' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports
          path: |
            playwright-report/
            test-results/

      # SARIF for upload-sarif.yml. Runs after failures too, so findings that
      # failed this job still reach code scanning. zizmor scans every workflow
      # (not just changed ones) because code scanning closes any alert missing
      # from the next upload; with --format sarif it never fails the job.
      - name: Setup uv (SARIF)
        if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: zizmor SARIF
        if: ${{ !cancelled() && hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/sarif"
          uvx zizmor@1.30.1 --format sarif .github > "$RUNNER_TEMP/sarif/zizmor.sarif"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keep SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voidflow-sarif
          path: ${{ runner.temp }}/sarif/*.sarif
          if-no-files-found: ignore
          retention-days: 7
