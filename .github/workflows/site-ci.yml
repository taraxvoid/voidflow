name: Validation

# Validation job for sites using a Astro/bun/Playwright stack
# for self-hosted runners pass `runner`
# Callers need pull_request/workflow_dispatch triggers, plus push on main/next/live
# so direct pushes are validated too
# Caller is expected to define referenced package.json scripts

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label for the validate job. Defaults to a GitHub-hosted
          runner; pass a self-hosted label (e.g. 'my-hosted-runner')
        type: string
        default: ubuntu-latest
      playwright-install-with-deps:
        description: >
          Whether the Playwright install step also apt-installs OS-level
          browser deps via sudo (`--with-deps`). GitHub-hosted runners need
          this. Self-hosted runners with those deps already baked into the
          image should pass `false` -- some runner containers set
          no-new-privileges, which makes sudo (and so --with-deps) fail
          outright.
        type: boolean
        default: true
      package-manager:
        description: >
          Package manager for setup, dependency cache, install and every
          script call: 'bun' or 'pnpm'. For pnpm the pnpm version comes from
          `packageManager` in package.json and Node from `volta` / `engines`
          in package.json. The lockfile name follows (bun.lock or
          pnpm-lock.yaml).
        type: string
        default: bun
      e2e-extra-paths:
        description: >
          JSON array of extra globs that count as e2e-relevant changes, on top
          of the built-in src/, public/, test/, scripts/, astro/playwright
          config, package.json, lockfile, tsconfig.json and workflows.
        type: string
        default: '["wrangler.jsonc", "site.vars.json"]'
      single-environment:
        description: >
          For sites with one production environment and no next/live
          branches (same meaning as in resolve-env): `main` is production,
          so PRs and pushes to `main` run the production test tier (all e2e,
          accessibility, Lighthouse) instead of only `test:e2e:full`.
          Defaults to false (main/next/live run dev/staging/prod tiers).
        type: boolean
        default: false
      build-env:
        description: >
          JSON object of environment variables for the build step, e.g.
          '{"PUBLIC_SITE_URL": "https://example.com", "GIT_SHA": "abc"}'.
          Build the string in the caller with toJSON/format. Not for secrets
          (inputs are visible in logs).
        type: string
        default: '{}'
    secrets:
      GITLEAKS_LICENSE:
        description: >
          Optional gitleaks Organization license (gitleaks.io). Cross-account
          `secrets: inherit` doesn't reliably forward repo secrets to a
          reusable workflow owned by a different account, so callers on a
          gitleaks Organization plan should pass this explicitly via
          `secrets: { GITLEAKS_LICENSE: secrets.GITLEAKS_LICENSE }` (wrapped
          in the caller's own expression syntax).
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      PM: ${{ inputs.package-manager }}
      LOCKFILE: ${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'bun.lock' }}
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sharp edge: gitleaks requires full commit history
          persist-credentials: false

      - name: Secrets Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        
      - name: Check package manager
        run: |
          case "$PM" in
            bun | pnpm) ;;
            *) echo "::error::package-manager must be 'bun' or 'pnpm', got '$PM'" >&2; exit 1 ;;
          esac

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            lockfile:
              - '${{ env.LOCKFILE }}'
            scripts:
              - 'scripts/**'
            workflows:
              - '.github/workflows/**'
            e2e_relevant:
              - 'src/**'
              - 'public/**'
              - 'test/**'
              - 'scripts/**'
              - 'astro.config.*'
              - 'playwright.config.*'
              - 'package.json'
              - '${{ env.LOCKFILE }}'
              - 'tsconfig.json'
              - '.github/workflows/**'
            e2e_extra: ${{ inputs.e2e-extra-paths }}

      - name: Resolve e2e relevance
        id: e2e
        run: echo "relevant=$([[ "$MAIN" == true || "$EXTRA" == true ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          MAIN: ${{ steps.changes.outputs.e2e_relevant }}
          EXTRA: ${{ steps.changes.outputs.e2e_extra }}

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # XXX holding off on pinning here until 1.4.x is stable
        # in caller: specify version in package.json or .bun-version to override
        # falls through to 'latest' if not provided
        # with:
          # bun-version: 1.4.2
          # bun-version-file: ".bun-version"

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # pnpm version comes from `packageManager` in the caller's package.json

      - name: Setup Node (pnpm)
        if: inputs.package-manager == 'pnpm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # reads `volta` / `engines`
          cache: pnpm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.package-manager == 'bun'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(env.LOCKFILE) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles(env.LOCKFILE, 'playwright.config.*', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install NPM Dependencies
        run: '"$PM" install --frozen-lockfile'

      - name: Detect package scripts
        id: scripts
        # Fail open: a check whose script the caller doesn't define is skipped, not failed.
        run: |
          for name in lint check build test:unit check:licenses test:e2e:full test:e2e:all test:e2e:a11y test:e2e:lighthouse; do
            if jq -e --arg n "$name" '.scripts // {} | has($n)' package.json >/dev/null; then
              echo "${name//:/_}=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Skipping '$name': no such script in package.json"
            fi
          done

      - name: Lint CI workflows
        if: steps.changes.outputs.workflows == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7/scripts/download-actionlint.bash \
            | bash -s -- 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
        shell: bash

      - name: Lint Code
        if: steps.scripts.outputs.lint == 'true'
        run: '"$PM" run lint'

      - name: TypeCheck Code
        if: steps.scripts.outputs.check == 'true'
        run: '"$PM" run check'

      - name: Build Code
        if: steps.scripts.outputs.build == 'true'
        run: '"$PM" run build'
        env: ${{ fromJSON(inputs.build-env) }}

      - name: Unit Tests
        if: steps.scripts.outputs.test_unit == 'true'
        run: '"$PM" run test:unit'

      - name: Check Licenses for GPL kudzu
        if: steps.scripts.outputs.check_licenses == 'true' && (steps.changes.outputs.lockfile == 'true' || steps.changes.outputs.scripts == 'true')
        run: '"$PM" run check:licenses'

      - name: Install Playwright
        if: steps.e2e.outputs.relevant == 'true' && inputs.playwright-install-with-deps
        run: npx playwright install --with-deps chromium # npx has better compat than bunx for this

      - name: Install Playwright (no OS deps)
        if: steps.e2e.outputs.relevant == 'true' && !inputs.playwright-install-with-deps
        run: npx playwright install chromium

      - name: Resolve test tier
        id: tier
        # Which branch's test tier applies: the PR base on pull requests, the
        # pushed branch on pushes. Single-environment sites treat main as live.
        run: |
          target="$BASE_REF"
          if [[ "$SINGLE" == "true" && "$target" == main ]]; then target=live; fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          SINGLE: ${{ inputs.single-environment }}

      - name: E2E - Dev
        if: steps.scripts.outputs.test_e2e_full == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push') && steps.tier.outputs.target == 'main'
        run: '"$PM" run test:e2e:full'

      - name: E2E - Staging
        if: steps.scripts.outputs.test_e2e_all == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push') && steps.tier.outputs.target == 'next'
        run: '"$PM" run test:e2e:all'

      - name: E2E - Accessibility (staging)
        if: steps.scripts.outputs.test_e2e_a11y == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push') && steps.tier.outputs.target == 'next'
        run: '"$PM" run test:e2e:a11y'

      - name: E2E - Production
        if: steps.scripts.outputs.test_e2e_all == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push') && steps.tier.outputs.target == 'live'
        run: '"$PM" run test:e2e:all'

      - name: E2E - Accessibility (production)
        if: steps.scripts.outputs.test_e2e_a11y == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push') && steps.tier.outputs.target == 'live'
        run: '"$PM" run test:e2e:a11y'

      - name: E2E - Lighthouse (production)
        if: steps.scripts.outputs.test_e2e_lighthouse == 'true' && steps.e2e.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name=='push') && steps.tier.outputs.target == 'live'
        run: '"$PM" run test:e2e:lighthouse'

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports
          path: |
            playwright-report/
            test-results/
