# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream. Adapted from
# github/gh-actions-lock's verify-lockfile.yml. The weekly run catches tags
# that were re-pointed upstream after they were locked.
#
# Relock locally with `gh actions-lock` (or `--relock` to advance moved refs).
# Never run `--accept-moved` from automation.

name: verify-lockfile

on:
  pull_request:
  push:
    branches: [main, next]
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: v0.4.1 # renovate: datasource=github-releases depName=github/gh-actions-lock
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin "$VERSION"
      - run: gh actions-lock --verify
