name: Tag Release

# Manual release, step 2 of 2 — fires automatically once the PR opened by
# `just release` (release.yml's "chore(release): prepare for vX.Y.Z" PR)
# lands on main. Tags the merge commit and creates the GitHub release from
# the changelog section for that version. Tag pushes aren't covered by
# main's branch-protection ruleset (it targets refs/heads/main only), so
# this doesn't need the PR step release.yml needs.
on:
  push:
    branches: [main]

jobs:
  tag:
    name: Tag and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: "contains(github.event.head_commit.message, 'chore(release): prepare for v')"
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-cliff
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: git-cliff

      - name: Extract tag
        id: version
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # squash-merge appends " (#NN)" to the PR title (line 1), so match a
          # trailing optional " (#...)" rather than anchoring to end-of-line.
          # A regular (non-squash) merge instead produces a merge-commit
          # message like "Merge pull request #NN from ...\n\nchore(release):
          # prepare for vX.Y.Z", putting the title on a later line — scan all
          # lines rather than assuming line 1.
          TAG=$(sed -En 's/^chore\(release\): prepare for (v[0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$/\1/p' <<< "$HEAD_COMMIT_MESSAGE" | head -n1)
          if [ -z "$TAG" ]; then
            echo "::error::Could not extract a vX.Y.Z tag from the head commit message." >&2
            exit 1
          fi
          if git tag --list "$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists — nothing to do." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"

      - name: Extract release notes
        run: git-cliff --config cliff.toml --current --strip header -o release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

  publish:
    name: Publish to npm
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing (OIDC): no NPM_TOKEN. The package's trusted publisher
    # on npmjs.com must name this repo, this workflow file and this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package.json version matches tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version package.json)
          if [ "v${PKG_VERSION}" != "$TAG" ]; then
            echo "::error::package.json version ${PKG_VERSION} does not match tag ${TAG}." >&2
            exit 1
          fi

      - name: Publish @taraxvoid/voidflow
        run: npm publish

      # Unscoped mirror of the same tarball, so `bun add -d voidflow` and
      # `bunx voidflow` work. Needs its own trusted publisher entry on npmjs.com.
      - name: Publish voidflow (unscoped mirror)
        run: |
          set -euo pipefail
          npm pkg set name=voidflow
          npm publish
