name: deps-review gate

# Reusable. Posts the `deps-review` check run on PRs that are not from
# Renovate or Dependabot, so `deps-review` can be a required check: on
# dependency PRs only the deps-review agent posts it, and on everyone else's
# PRs this does.
#
# "Not a bot" is not "reviewed": an agent or a contributor can change
# dependencies too. So the check passes only when the PR touches no lockfile
# and no dependency field of any package.json. Otherwise it fails as "Needs
# you" and lists what changed; after reviewing, an admin merges past it (the
# rulesets' admin bypass), or a manual deps-review run replaces it.
#
# The job is deliberately not named `deps-review`. GitHub counts a skipped job
# as a passing check of the same name, so a `deps-review` job skipped on bot
# PRs would satisfy the required check before the agent had reviewed anything.
#
# Callers must grant `checks: write`, `contents: read` and
# `pull-requests: read`.

on:
  workflow_call:

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  pass-through:
    name: deps-review pass-through
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Post deps-review check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The lockfiles deps-signals knows (plus npm-shrinkwrap.json), and
          # the package.json fields that decide what gets installed.
          lockfiles=' bun.lock bun.lockb pnpm-lock.yaml package-lock.json npm-shrinkwrap.json yarn.lock '
          fields='["dependencies", "devDependencies", "optionalDependencies",
            "peerDependencies", "bundleDependencies", "bundledDependencies",
            "overrides", "resolutions", "pnpm", "patchedDependencies",
            "trustedDependencies", "workspaces", "catalog", "catalogs"]'

          # package.json's dependency fields at a commit; {} when the file is absent.
          deps() {
            { gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/$REPO/contents/$1?ref=$2" 2>/dev/null || echo '{}'; } \
              | jq -S --argjson f "$fields" '. as $p | [$f[] | select($p[.] != null) | {(.): $p[.]}] | add // {}'
          }

          # The PR's diff is against the merge base, not the base branch tip.
          base=$(gh api "repos/$REPO/compare/$BASE...$SHA" | jq -r .merge_base_commit.sha)
          changed=()
          while IFS=$'\t' read -r file old; do
            name=${file##*/}
            if [[ "$lockfiles" == *" $name "* ]]; then
              changed+=("$file")
            elif [ "$name" = package.json ] &&
              [ "$(deps "${old:-$file}" "$base")" != "$(deps "$file" "$SHA")" ]; then
              changed+=("$file")
            fi
          done < <(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" |
            jq -r '.[] | [.filename, (.previous_filename // "")] | @tsv')

          if [ "${#changed[@]}" -eq 0 ]; then
            conclusion=success
            title='No dependency changes'
            summary='deps-review only reviews Renovate and Dependabot PRs, and this one changes no lockfile or package.json dependency field.'
          else
            conclusion=failure
            title='Needs you'
            # shellcheck disable=SC2016 # literal backticks: Markdown code spans
            list=$(printf -- '- `%s`\n' "${changed[@]}")
            summary="This PR was not opened by Renovate or Dependabot, but it changes dependencies, so nothing has reviewed them:

          ${list}

          Review them yourself, then merge with an admin bypass, or run deps-review by hand for PR #${PR} to replace this check."
          fi
          jq -n --arg sha "$SHA" --arg c "$conclusion" --arg t "$title" --arg s "$summary" \
            '{name: "deps-review", head_sha: $sha, status: "completed", conclusion: $c, output: {title: $t, summary: $s}}' |
            gh api "repos/$REPO/check-runs" --input -
