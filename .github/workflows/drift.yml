# This repo's own drift check: voidflow-drift.yml against voidflow.config.ts,
# after each push to main and weekly.
name: voidflow drift
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  drift:
    permissions:
      contents: read
      issues: write # the drift issue
      actions: read # environments
    uses: ./.github/workflows/voidflow-drift.yml
