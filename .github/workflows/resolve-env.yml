name: Resolve env

# Resolves the deploy environment (dev/staging/prod) for the current branch
# using the same mapping as the branch-env-map action, exposing it as a job
# output so callers can reference it in a downstream job's `name:` (e.g.
# `Deploy [${{ needs.resolve-env.outputs.env }}]`).
# Job names may use the `needs` context, but not composite action outputs
# directly, so this indirection is what makes that possible.

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner label for the resolve-env job. Defaults to a GitHub-hosted
          runner; pass a self-hosted label to match the caller's deploy job.
        type: string
        default: ubuntu-latest
      single-environment:
        description: >
          Single production environment with per-PR previews and no next/live
          branches: main maps to prod and pull requests to preview. Defaults
          to false (main/next/live to dev/staging/prod).
        type: boolean
        default: false
    outputs:
      env:
        description: Resolved environment name (dev, staging, or prod).
        value: ${{ jobs.resolve-env.outputs.env }}

jobs:
  resolve-env:
    name: Resolve env
    runs-on: ${{ inputs.runner }}
    outputs:
      env: ${{ steps.map.outputs.env }}
    steps:
      # Same mapping as actions/branch-env-map (a test keeps them identical).
      # Inlined because a reusable workflow can't reach `./actions/...` in its
      # own repo: checkout gives it the caller's tree, not voidflow's.
      - id: map
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          SINGLE: ${{ inputs.single-environment }}
        run: |
            if [[ "$SINGLE" == "true" ]]; then
              if [[ "$EVENT_NAME" == pull_request* ]]; then
                echo "env=preview" >> "$GITHUB_OUTPUT"
              elif [[ "$REF_NAME" == main ]]; then
                echo "env=prod" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Refusing to deploy unknown ref: $REF_NAME (expected main or a pull request)" >&2
                exit 1
              fi
              exit 0
            fi
            case "$REF_NAME" in
              main) echo "env=dev" >> "$GITHUB_OUTPUT" ;;
              next) echo "env=staging" >> "$GITHUB_OUTPUT" ;;
              live) echo "env=prod" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Refusing to deploy unknown branch: $REF_NAME (expected main, next, or live)" >&2; exit 1 ;;
            esac
