name: Release Please

# Release channels (see RELEASING.md):
#   main         stable      npm dist-tag `latest`
#   main+canary  canary      npm dist-tag `next`  (X.Y.Z-next.N, on demand)
#   release/N.x  maintenance npm dist-tag `release-N.x`
#
# On every push to main or a maintenance branch release-please maintains a
# standing release PR using that branch's config from .release-please/. Merging
# it bumps the version files, pushes the vX.Y.Z tag and creates the GitHub
# release (all by release-please itself), then the publish job pushes the
# tagged commit to npm and JSR under the channel's dist-tag.
#
# A canary is cut on demand (`just canary`, or workflow_dispatch with canary
# ticked, from main): the canary job commits the canary version on top of
# main's tip, tags that commit (it never lands on main) and the same publish
# job publishes the tag under `next`.
#
# token is a GitHub App installation token, not the default GITHUB_TOKEN:
# events authored by GITHUB_TOKEN don't trigger other workflows, so the
# release PR would open without CI ever running on it. RELEASE_BOT_CLIENT_ID /
# RELEASE_BOT_APP_PRIVATE_KEY are org-level secrets shared with the sibling
# repos.
#
# npm publishing uses trusted publishing (OIDC). Each npm tarball is packed
# once, attested with actions/attest (SLSA build provenance in GitHub's
# attestation store), and that same file is published, so the bytes on npm are
# the bytes the attestation covers. RELEASING.md shows how to verify one.
#
on:
  push:
    branches: [main, "release/**"]
  # Manual run, from the branch you pick under "Use workflow from". Give it
  # exactly one of:
  #  - tag: republish an existing release's tag (e.g. after fixing npm
  #    trusted-publisher config); skips release-please and only runs `publish`.
  #    main takes a stable tag or a canary tag (X.Y.Z-next.N), release/N.x its
  #    own line's tags. A tag whose version does not fit that channel, or whose
  #    commit is not on that branch (a canary's parent, for a canary tag), is
  #    rejected.
  #  - canary: cut and publish a canary from main's tip.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (e.g. v0.7.0); leave empty for a canary"
        required: false
        type: string
      canary:
        description: "Cut a canary X.Y.Z-next.N from main's tip and publish it under the next dist-tag"
        required: false
        default: false
        type: boolean
      dry-run:
        description: "Run the publish steps with --dry-run (nothing is published)"
        required: false
        default: false
        type: boolean

permissions: {}

# One release run per branch at a time; never cancel a run mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  channel:
    name: Resolve channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.channel.outputs.kind }}
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
      config: ${{ steps.channel.outputs.config }}
      manifest: ${{ steps.channel.outputs.manifest }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Require exactly one of tag or canary
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          CANARY: ${{ inputs.canary }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ] && [ "$CANARY" = "true" ]; then
            echo "::error::Give a tag to republish or tick canary, not both." >&2
            exit 1
          fi
          if [ -z "$TAG" ] && [ "$CANARY" != "true" ]; then
            echo "::error::Give a tag to republish, or tick canary." >&2
            exit 1
          fi

      # Fails the run for any branch that is not a release channel. main is
      # the canary channel for a canary run or a canary tag (-next), the
      # stable channel otherwise.
      - name: Resolve release channel from branch
        id: channel
        env:
          BRANCH: ${{ github.ref_name }}
          CANARY: ${{ inputs.canary || contains(inputs.tag, '-next') }}
        run: |
          set -euo pipefail
          args=("$BRANCH")
          if [ "$CANARY" = "true" ]; then args+=(--canary); fi
          bun scripts/release-channel.ts "${args[@]}" >> "$GITHUB_OUTPUT"

  release-please:
    name: Release Please
    needs: channel
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          config-file: ${{ needs.channel.outputs.config }}
          manifest-file: ${{ needs.channel.outputs.manifest }}

  # Canary: the version is the one release-please proposes plus -next.<n>
  # (scripts/canary-version.ts). The commit that carries it never lands on
  # main, so release-please never sees it; only its tag is pushed.
  canary:
    name: Cut canary
    needs: channel
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.canary &&
      needs.channel.outputs.kind == 'canary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag_name: ${{ steps.cut.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      # main's tip as of now, not the commit that queued this run: if main
      # advanced while the run waited, the version below comes from the
      # current release PR and must describe the code it is built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # Refuses when main has no open release PR (nothing releasable yet).
      - name: Resolve the canary version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/canary-version.ts --apply >> "$GITHUB_OUTPUT"

      # A rerun for the same commit gets the same version and finds the tag
      # and release already there, so it changes nothing. A dry run stops here:
      # nothing is pushed, and publish does not run.
      - name: Commit, tag and create the prerelease
        id: cut
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run: would cut ${TAG} from $(git rev-parse --short HEAD); nothing pushed, nothing published."
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            # Reuse the tag only when it was cut from this very commit; a tag
            # on some other parent would publish stale code under this version.
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)
            parent=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${existing}" --jq '.parents[0].sha')
            if [ "$parent" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag ${TAG} exists but was cut from ${parent}, not from $(git rev-parse HEAD). Refusing to reuse it." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists for this commit, skipping the commit and tag."
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --quiet -am "chore: canary ${VERSION}"
            git tag "$TAG"
            REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push "$REMOTE" "refs/tags/${TAG}"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag --title "$TAG" --generate-notes
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: [channel, release-please, canary]
    if: >-
      !cancelled() &&
      needs.channel.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       needs.canary.outputs.tag_name != '' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # Tooling comes from the branch that triggered the run, not the tag, so
      # republishing an old tag still gets the current channel checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # Abort before anything is published unless the tag belongs to this
      # channel: its version fits the channel (a -next tag on a stable run, a
      # stable tag on a canary run, or another line's tag on release/N.x are
      # rejected) and the tagged commit is on this branch (so a maintenance tag
      # cannot be republished from main, or the reverse). A canary's commit is
      # never on main; its parent is, and it may change only the version files.
      # Compare against the branch tip (origin/<branch>, fetched by the checkout
      # above), not HEAD: release-please tags the branch as it is when it runs,
      # so if the release PR merges while an earlier push's run is in flight,
      # that run tags a commit newer than its own checkout. Checking HEAD
      # rejected it, and the release PR's own run then saw the release as
      # already created and skipped publishing (v0.12.2).
      - name: Check tag belongs to this channel
        env:
          BRANCH: ${{ github.ref_name }}
          KIND: ${{ needs.channel.outputs.kind }}
          TAG: ${{ inputs.tag || needs.canary.outputs.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          args=("$BRANCH" "${TAG#v}")
          if [ "$KIND" = "canary" ]; then args+=(--canary); fi
          bun scripts/release-channel.ts "${args[@]}" > /dev/null
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$KIND" = "canary" ]; then
            parent=$(git rev-parse "${commit}^1")
            if ! git merge-base --is-ancestor "$parent" "refs/remotes/origin/${BRANCH}"; then
              echo "::error::Canary ${TAG} is not built on ${BRANCH}; its parent commit is not on the branch." >&2
              exit 1
            fi
            extra=$(git diff --name-only "$parent" "$commit" | grep -vxE 'package\.json|jsr\.json|agentic/workflows/deps-review\.md' || true)
            if [ -n "$extra" ]; then
              echo "::error::Canary ${TAG} changes more than the version files: ${extra}" >&2
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$commit" "refs/remotes/origin/${BRANCH}"; then
            echo "::error::Tag ${TAG} is not on branch ${BRANCH}; run this workflow from the branch that owns the tag." >&2
            exit 1
          fi

      # The tag checkout below replaces the working tree, and a tag cut before
      # this helper existed (a manual republish) does not have it. Keep the
      # copy from the workflow branch.
      - name: Keep the stage summary helper from the workflow branch
        run: cp scripts/stage-summary.sh "$RUNNER_TEMP/stage-summary.sh"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.canary.outputs.tag_name || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # `npm stage publish` needs npm >= 11.15.0, newer than Node 24's bundled
      # npm, so install an exact pinned version (npm 12 needs Node >= 24.15).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm
        env:
          # renovate: datasource=npm depName=npm
          NPM_VERSION: 12.2.1
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - name: Check package.json version matches tag
        env:
          TAG: ${{ inputs.tag || needs.canary.outputs.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version package.json)
          if [ "v${PKG_VERSION}" != "$TAG" ]; then
            echo "::error::package.json version ${PKG_VERSION} does not match tag ${TAG}." >&2
            exit 1
          fi
          JSR_VERSION=$(jq -r .version jsr.json)
          if [ "${JSR_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::jsr.json version ${JSR_VERSION} does not match package.json ${PKG_VERSION}." >&2
            exit 1
          fi

      # The voidflow bin and the fleet exports' Node entry points live in dist/,
      # which is gitignored. Packing runs `prepack` (which builds too), but npm's
      # script handling under --ignore-scripts is not something to lean on, so
      # build here. A tag from before dist/ existed has no build script.
      - name: Build dist
        run: |
          set -euo pipefail
          if jq -e '.scripts.build' package.json >/dev/null; then
            bun run build
          else
            echo "No build script at this tag; nothing to build."
          fi

      # Pack each package that isn't on npm yet. The mirror is the same code
      # under the bare `voidflow` name with a pointer blurb above the README; the working tree
      # is restored afterwards so JSR publishes the real README. npm still runs
      # `prepare` despite --ignore-scripts (it only installs git hooks here) and
      # prints it on stdout, so the tarball path is derived, not parsed.
      - name: Pack npm tarballs
        id: pack
        env:
          PACK_DIR: ${{ runner.temp }}/npm-pack
        run: |
          set -euo pipefail
          mkdir -p "$PACK_DIR"
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          # npm names the tarball <name>-<version>.tgz, @scope/pkg as scope-pkg.
          pack() {
            local name file
            name=$(jq -r .name package.json)
            file="${PACK_DIR}/$(echo "${name#@}" | tr / -)-${VERSION}.tgz"
            npm pack --ignore-scripts --pack-destination "$PACK_DIR" >&2
            test -f "$file"
            # Every bin must be in the tarball (dist/ is built, not committed).
            local bin
            for bin in $(jq -r '.bin // {} | .[]' package.json); do
              if ! tar -tzf "$file" "package/${bin}" >/dev/null 2>&1; then
                echo "::error::${file##*/} is missing its bin ${bin}" >&2
                exit 1
              fi
            done
            echo "$file"
          }

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm, skipping."
          else
            # Assign first: set -e ignores a failure inside `echo "x=$(...)"`.
            file=$(pack)
            echo "scoped=${file}" >> "$GITHUB_OUTPUT"
          fi

          if npm view "voidflow@${VERSION}" version >/dev/null 2>&1; then
            echo "voidflow@${VERSION} is already on npm, skipping."
          else
            npm pkg set name=voidflow
            # Pointer blurb on top, then the full README minus its own H1.
            { cat scripts/mirror-readme.md; printf '\n---\n'; tail -n +2 README.md; } > "$PACK_DIR/mirror-README.md"
            cp "$PACK_DIR/mirror-README.md" README.md
            file=$(pack)
            echo "mirror=${file}" >> "$GITHUB_OUTPUT"
            git checkout -- package.json README.md
          fi
          ls -l "$PACK_DIR"

      # Before any publish, so a version never reaches npm without its
      # attestation. Skipped on a dry run, which would otherwise write real
      # attestations for tarballs that are never published.
      - name: Attest npm tarballs
        if: >-
          !inputs.dry-run &&
          (steps.pack.outputs.scoped != '' || steps.pack.outputs.mirror != '')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/npm-pack/*.tgz

      # JSR is linked to this repo so trusted publishing Just Works^TM
      - name: Publish @taraxvoid/voidflow to JSR
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test
          npx --yes jsr publish "${flags[@]}"

      - name: Publish @taraxvoid/voidflow to NPM (scoped canonical package)
        if: steps.pack.outputs.scoped != ''
        env:
          DIST_TAG: ${{ needs.channel.outputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          TARBALL: ${{ steps.pack.outputs.scoped }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          : "${DIST_TAG:?npm dist-tag is empty; refusing to publish}"
          log=$(mktemp)
          if npm stage publish "$TARBALL" --tag "$DIST_TAG" "${flags[@]}" 2>&1 | tee "$log"; then
            bash "$RUNNER_TEMP/stage-summary.sh" "$log"
            exit 0
          fi
          # Staged versions share the published-version index, so restaging is
          # a 409. Trusted-publishing tokens cannot run `npm stage list`, and
          # `npm view` (in the pack step) cannot see unapproved versions, so the
          # 409 is the check.
          if grep -qE '\bE409\b|409 Conflict' "$log"; then
            echo "::notice::${TARBALL##*/} is already staged; approve it on npmjs.com."
            exit 0
          fi
          exit 1

      # Unscoped mirror with the same code and version. It mainly reserves the
      # bare `voidflow` name; the README gets a short pointer to the scoped
      # package on top, followed by the full README.
      - name: Publish voidflow (unscoped mirror)
        if: steps.pack.outputs.mirror != ''
        env:
          DIST_TAG: ${{ needs.channel.outputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          TARBALL: ${{ steps.pack.outputs.mirror }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          : "${DIST_TAG:?npm dist-tag is empty; refusing to publish}"
          log=$(mktemp)
          if npm stage publish "$TARBALL" --tag "$DIST_TAG" --loglevel verbose "${flags[@]}" 2>&1 | tee "$log"; then
            bash "$RUNNER_TEMP/stage-summary.sh" "$log"
            exit 0
          fi
          # See the scoped step: a 409 means this version is already staged.
          if grep -qE '\bE409\b|409 Conflict' "$log"; then
            echo "::notice::${TARBALL##*/} is already staged; approve it on npmjs.com."
            exit 0
          fi
          exit 1

      # `npm stage approve` takes no extra tags and this job's token cannot
      # move dist-tags, so @next follows a stable release by hand.
      - name: Point at sync-next after a stable release
        if: needs.channel.outputs.kind == 'stable' && !inputs.dry-run
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          {
            echo "### After approving both packages on npm"
            echo
            echo "Move \`@next\` to the stable version (the next canary moves it forward again):"
            echo
            echo '```bash'
            echo "just sync-next ${TAG#v}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Stable releases only: v<major> (v0 until 1.0) follows the newest stable
  # release. Prereleases and maintenance releases never move it. Immutable
  # vX.Y.Z tags are untouched.
  floating-tag:
    name: Move floating major tag
    needs: [channel, release-please]
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.channel.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Point v<major> at the release commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v${MAJOR}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="$SHA" -F force=true
          else
            # First stable release on this major: the tag does not exist yet.
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$SHA"
          fi
          echo "${TAG} -> ${SHA}"
