name: Release

# Manual release — nothing here runs automatically on merge. Trigger
# explicitly when it's time to cut a release: regenerates CHANGELOG.md via
# git-cliff, runs the same validation ci.yml runs, commits, tags, and
# creates a GitHub release. Version is given explicitly (this repo's only
# prior tag, v0.2, predates semver-strict tagging, so `--bumped-version`
# isn't trustworthy yet) — once a real vX.Y.Z tag exists, future runs can
# leave it blank to have git-cliff compute the next version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 0.3.0). Leave blank to let git-cliff compute the next version from an existing vX.Y.Z tag."
        required: false
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-cliff and just
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: git-cliff,just

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install shellcheck
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) sc_arch=x86_64 ;;
            aarch64|arm64) sc_arch=aarch64 ;;
            *) echo "::error::unsupported arch for shellcheck: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.${sc_arch}.tar.xz" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7/scripts/download-actionlint.bash \
            | bash -s -- 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            VERSION=$(git-cliff --config cliff.toml --bumped-version | sed 's/^v//')
          else
            echo "::error::No version input given and no prior vX.Y.Z tag to bump from. Pass the version input explicitly." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git tag --list "$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists — nothing to release." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git-cliff --config cliff.toml --tag "$TAG" -o CHANGELOG.md

      - name: Validate
        run: just validate
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): prepare for ${TAG}"
          git tag "$TAG"
          git push origin "HEAD:${REF_NAME}"
          git push origin "$TAG"

      - name: Extract release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git-cliff --config cliff.toml --current --strip header -o release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
