name: Branch env map
description: >
  Maps the trigger to an environment name for single-environment sites: main
  is the only production branch (prod) and pull requests map to preview. Any
  other ref fails, so deploy jobs can't silently no-op on an unexpected branch.

outputs:
  env:
    description: Resolved environment name (prod or preview).
    value: ${{ steps.map.outputs.env }}

runs:
  using: composite
  steps:
    - id: map
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [[ "$EVENT_NAME" == pull_request* ]]; then
          echo "env=preview" >> "$GITHUB_OUTPUT"
        elif [[ "$REF_NAME" == main ]]; then
          echo "env=prod" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Refusing to deploy unknown ref: $REF_NAME (expected main or a pull request)" >&2
          exit 1
        fi
