name: Cloudflare deploy
description: >
  Wrangler deploy against a resolved environment (see branch-env-map),
  with an optional D1 migration step first. Deliberately thin: build,
  binding verification, and post-deploy checks stay in the caller's own
  job since those vary per app.

inputs:
  env:
    description: Target environment name (dev/staging/prod) — e.g. branch-env-map's output.
    required: true
  cloudflare-api-token:
    description: Cloudflare API token with permission to deploy the target Worker.
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID. Optional if the API token is scoped to a single account.
    required: false
    default: ''
  working-directory:
    description: Directory to run wrangler (and, if enabled, the D1 migration) from.
    default: '.'
  command:
    description: >
      Full wrangler subcommand and args. Defaults to 'deploy --env <env>'.
      Astro's Cloudflare adapter writes the real worker config into its build
      output plus a redirect at .wrangler/deploy/config.json, which plain
      'deploy' follows. Passing '--config' (even to the root wrangler.jsonc)
      bypasses the redirect and deploys an assets-only Worker.
    default: ''
  migrate-d1:
    description: If 'true', run 'bun run db:migrate:<env>' before deploying.
    default: 'false'
  token-fallback:
    description: >
      Pass vars.CF_TOKEN_FALLBACK. Set by 'just cf-tokens-apply' when the
      env's token needed an account-wide fallback; non-empty adds a warning
      to every deploy so the wider grant is never silent.
    default: ''

outputs:
  deployment-url:
    description: The deployed URL, as reported by wrangler-action, sanitized to a bare URL.
    value: ${{ steps.sanitize-url.outputs.url }}

runs:
  using: composite
  steps:
    - name: Warn about a fallback token
      if: ${{ inputs.token-fallback != '' }}
      shell: bash
      env:
        FALLBACK: ${{ inputs.token-fallback }}
        ENV_NAME: ${{ inputs.env }}
      run: |
        msg="Cloudflare token for $ENV_NAME has an account-wide Workers grant: $FALLBACK. See voidflow cloudflare/tokens.ts."
        echo "::warning title=Cloudflare token fallback::$msg"
        printf '> [!WARNING]\n> %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"

    - name: Apply D1 migrations
      if: ${{ inputs.migrate-d1 == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        ENV_NAME: ${{ inputs.env }}
      run: bun run "db:migrate:$ENV_NAME"

    - id: resolve-command
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_WD: ${{ inputs.working-directory }}
      run: |
        cmd="$INPUT_COMMAND"
        if [ -z "$cmd" ]; then cmd="deploy --env $INPUT_ENV"; fi
        if [[ " $cmd " == *" --config "* || " $cmd " == *" -c "* || " $cmd " == *" --config="* ]] \
          && [ -f "$INPUT_WD/.wrangler/deploy/config.json" ]; then
          echo "::warning::command passes --config, but $INPUT_WD/.wrangler/deploy/config.json exists (build-generated redirect). --config bypasses it and can deploy the wrong config (e.g. an assets-only Worker). Drop --config unless intended."
        fi
        echo "cmd=$cmd" >> "$GITHUB_OUTPUT"

    - name: Deploy
      id: deploy
      uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        workingDirectory: ${{ inputs.working-directory }}
        command: ${{ steps.resolve-command.outputs.cmd }}

    - id: sanitize-url
      shell: bash
      env:
        RAW_URL: ${{ steps.deploy.outputs.deployment-url }}
      # wrangler-action's deployment-url is taken verbatim from wrangler's `targets`
      # list, which for a worker with custom-domain routes reads like
      # "example.com (custom domain)" rather than a URL -- strip that
      # trailing " (...)" annotation and add a scheme if one isn't already
      # present, so consumers always get a URL page.goto()/curl can use.
      run: |
        url="${RAW_URL%% (*}"
        if [ -n "$url" ] && [[ "$url" != http://* && "$url" != https://* ]]; then
          url="https://$url"
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
