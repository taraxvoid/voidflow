name: Cloudflare preview
description: >
  Creates or updates a Cloudflare Worker Preview with 'wrangler preview', one
  per pull request by default (named pr-<number>), and comments its URL on the
  PR, updating the same comment on later pushes. With delete, removes the
  Preview instead (run it on the 'closed' pull_request event). The Preview's
  bindings come from the 'previews' block in the wrangler config, so a PR
  never touches production resources. Build and post-deploy checks stay in
  the caller's job, as with cloudflare-deploy.

inputs:
  cloudflare-api-token:
    description: Cloudflare API token with permission to deploy the target Worker.
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID. Optional if the API token is scoped to a single account.
    required: false
    default: ''
  working-directory:
    description: Directory to run wrangler from.
    default: '.'
  name:
    description: Preview name. Defaults to pr-<number> on pull_request events, else the branch name.
    default: ''
  secrets:
    description: >
      Preview secrets as dotenv lines (KEY=value), passed with --secrets-file.
      Written to a 0600 file under RUNNER_TEMP and removed after the deploy.
    default: ''
  delete:
    description: If 'true', delete the Preview instead of deploying it.
    default: 'false'
  github-token:
    description: >
      Token with pull-requests write, used to comment the Preview URL. Leave
      empty to skip the comment.
    default: ''

outputs:
  preview-url:
    description: The Preview URL, which always points at the Preview's latest deployment. Empty on delete.
    value: ${{ steps.parse.outputs.url }}
  deployment-url:
    description: The URL of this deployment only. Empty on delete or when wrangler reports none.
    value: ${{ steps.parse.outputs.deployment-url }}
  name:
    description: The resolved Preview name.
    value: ${{ steps.resolve.outputs.name }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_DELETE: ${{ inputs.delete }}
        SECRETS: ${{ inputs.secrets }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        name="$INPUT_NAME"
        if [ -z "$name" ]; then
          if [ -n "$PR_NUMBER" ]; then name="pr-$PR_NUMBER"; else name="$REF_NAME"; fi
        fi
        # Preview names end up in a hostname: lowercase, [a-z0-9-] only.
        name=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
        if [ -z "$name" ]; then
          echo "::error::Could not derive a Preview name; pass the name input." >&2
          exit 1
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"

        if [ "$INPUT_DELETE" == true ]; then
          echo "cmd=preview delete --name $name --skip-confirmation" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        cmd="preview --name $name --json"
        if [ -n "$SECRETS" ]; then
          file="$RUNNER_TEMP/voidflow-preview-secrets.env"
          (umask 077; printf '%s\n' "$SECRETS" > "$file")
          cmd="$cmd --secrets-file $file"
        fi
        echo "cmd=$cmd" >> "$GITHUB_OUTPUT"

    - name: Preview
      id: preview
      uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        workingDirectory: ${{ inputs.working-directory }}
        command: ${{ steps.resolve.outputs.cmd }}

    - name: Remove secrets file
      if: ${{ always() && inputs.secrets != '' }}
      shell: bash
      run: rm -f "$RUNNER_TEMP/voidflow-preview-secrets.env"

    - id: parse
      if: ${{ inputs.delete != 'true' }}
      shell: bash
      env:
        OUTPUT: ${{ steps.preview.outputs.command-output }}
      # Documented shape: .preview.urls[0]. Falls back to the first https URL
      # anywhere in the output, in case the beta shape moves.
      run: |
        json=$(printf '%s' "$OUTPUT" | sed -n '/^[[:space:]]*{/,$p')
        url=$(jq -r '.preview.urls[0] // ([.. | strings | select(test("^https://"))] | first) // empty' <<< "$json" 2>/dev/null || true)
        deployment=$(jq -r '(.deployment.urls // .deployment_urls // [])[0] // empty' <<< "$json" 2>/dev/null || true)
        if [ -z "$url" ]; then
          echo "::error::wrangler preview reported no Preview URL" >&2
          exit 1
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "deployment-url=$deployment" >> "$GITHUB_OUTPUT"

    - name: Comment Preview URL
      if: ${{ inputs.delete != 'true' && inputs.github-token != '' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PREVIEW_NAME: ${{ steps.resolve.outputs.name }}
        PREVIEW_URL: ${{ steps.parse.outputs.url }}
        SHA: ${{ github.event.pull_request.head.sha }}
      # One comment per Preview, found by its marker, so other bots' comments
      # are never edited.
      run: |
        marker="<!-- voidflow-cloudflare-preview:$PREVIEW_NAME -->"
        body=$(printf '%s\nPreview: %s (at %s)\n' "$marker" "$PREVIEW_URL" "${SHA:0:7}")
        id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
        else
          gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
        fi
