name: Agentic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentic-locks:
    uses: taraxvoid/voidflow/.github/workflows/agentic-locks.yml@{{sha}} # v{{version}}

  deps-review-gate:
    permissions:
      checks: write
      contents: read
      pull-requests: read
    uses: taraxvoid/voidflow/.github/workflows/deps-review-gate.yml@{{sha}} # v{{version}}
